name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PERSISTENCE_DB_PATH: ${{ runner.temp }}/ci_market_data.db
      MARKET_DATA_PROVIDER: mock
      # Optional suites that need real services (skipped locally when these are unset).
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://postgres:testpw@localhost:5432/marketdata_test
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: marketdata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d marketdata_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Everything, with the DB-backed suites running against PostgreSQL and the real-time
      # suites against Redis (this includes ingestor failover and fencing).
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    # The browser code paths (HTTP wrapper + realtime client) against a real server with real auth.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
      AUTH_MODE: required
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789ab
      MARKET_DATA_PROVIDER: mock
      POLL_INTERVAL_SECONDS: "1"
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: cd web && npm ci && npm run build
      - run: alembic upgrade head
      - name: Start the server
        run: |
          nohup python -m uvicorn src.api.server:app --host 127.0.0.1 --port 8010 --ws-max-size 65536 > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8010/api/health && break; sleep 1; done
      - name: Live end-to-end tests
        run: cd web && E2E_BASE_URL=http://127.0.0.1:8010 npm run test:e2e
      - name: Server log
        if: failure()
        run: tail -n 80 server.log

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t market-data:ci .
      - name: The image can import every entrypoint
        # Catches a dependency that works locally but is missing from requirements.txt.
        run: docker run --rm market-data:ci python -c "import src.api.server, src.ingestor; print('ok')"
      - name: The image ships the built web app
        run: docker run --rm market-data:ci test -f web/dist/index.html
