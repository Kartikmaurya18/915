[project]
name = "live-market-data"
version = "1.0.0"
description = "Live Market Data, Option Chain & Candle Generation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "websockets>=13.0",
]

[tool.vercel]
entrypoint = "api.index:app"
