# Example reverse proxy for the gateways. A starting point, not a tested production config.
#
# What it does:
#   * terminates TLS and redirects HTTP to HTTPS
#   * load-balances several gateways (no sticky sessions needed: gateways are stateless)
#   * upgrades /ws and /ws/v1 to WebSockets and keeps idle sockets open longer than the heartbeat
#   * rate-limits the auth endpoints at the edge (the app also limits them, per account and per IP)
#   * passes the client address in X-Forwarded-For, so set TRUSTED_PROXY_HOPS=1 on the gateways
#
# Put the ingestors NOWHERE in this file: they serve no user traffic. Expose only /metrics-less public paths;
# /metrics is served by each gateway behind a bearer token (METRICS_TOKEN) and should be scraped on the private network.

upstream market_data_gateways {
    least_conn;
    server 10.0.1.11:8000 max_fails=2 fail_timeout=10s;
    server 10.0.1.12:8000 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

# A WebSocket upgrade needs "Connection: upgrade"; plain requests must not send it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=30r/m;

server {
    listen 80;
    server_name market.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name market.example.com;

    ssl_certificate     /etc/ssl/market.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/market.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The app sets its own security headers and a Content-Security-Policy on the web app shell.
    # Add HSTS only once you are sure every subdomain serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;   # the app rejects larger bodies too (MAX_BODY_BYTES)

    # Both WebSocket endpoints. The server sends a heartbeat every RT_HEARTBEAT_SECONDS (15 s); keep the
    # read timeout comfortably above that so an idle but healthy socket is never cut.
    location ~ ^/ws(/v1)?$ {
        proxy_pass http://market_data_gateways;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Sign-in and registration: a second line of defence in front of the app's own limits.
    location /api/auth/ {
        limit_req zone=auth_edge burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://market_data_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the REST API and the web app (index.html, hashed assets under /assets).
    location / {
        proxy_pass http://market_data_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Do not expose the metrics endpoint publicly.
    location = /metrics { return 404; }
}
