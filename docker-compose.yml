# Local stack in the production topology:
#
#   ingestor1 ─┐                      ┌─ app  (gateway, :8000)
#              ├─► redis (bus+lease) ─┤
#   ingestor2 ─┘   (one leads)        └─ app2 (gateway, :8001)
#                 both ─► db (PostgreSQL)
#
#   docker compose up --build
#   docker compose stop ingestor1     # watch ingestor2 take over (docker compose logs -f ingestor2)
#
# Never point this at production data. Secrets below are development placeholders only;
# real values come from your own .env or a secret manager.
x-common-env: &common-env
  DATABASE_URL: postgresql://marketdata:dev-only-password@db:5432/marketdata
  REDIS_URL: redis://redis:6379/0
  AUTH_MODE: required
  JWT_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
  # This stack is a local topology demo and its scripts register throw-away users, so it does not verify them.
  # Set VERIFICATION_MODE=both (with EMAIL_PROVIDER/SMS_PROVIDER, see docs/AUTH.md) to try the real flow.
  VERIFICATION_MODE: ${VERIFICATION_MODE:-off}
  MARKET_DATA_PROVIDER: mock
  POLL_INTERVAL_SECONDS: "1"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketdata
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: marketdata
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketdata -d marketdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # The bus and lease hold no data worth keeping: every message is superseded by the next tick.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *common-env
    depends_on:
      db:
        condition: service_healthy

  ingestor1: &ingestor
    build: .
    command: ["python", "-m", "src.ingestor"]
    healthcheck:
      # Ingestors do not serve the API on port 8000; their metrics listener is the liveness endpoint.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      <<: *common-env
      INGESTOR_ID: ingestor1
      INGESTOR_LEASE_TTL_MS: "4000"
      INGESTOR_METRICS_PORT: "9100"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestor2:
    <<: *ingestor
    environment:
      <<: *common-env
      INGESTOR_ID: ingestor2
      INGESTOR_LEASE_TTL_MS: "4000"
      INGESTOR_METRICS_PORT: "9100"

  app: &gateway
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      REALTIME_MODE: gateway
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app2:
    <<: *gateway
    ports:
      - "8001:8000"

volumes:
  pgdata:
